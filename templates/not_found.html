{% extends "base.html" %}

{% block title %}{{ ui.not_found_title }} — {{ studio_name }}{% endblock %}

{% block content %}
<section class="hero solo">
  <div class="hero-copy" data-enter>
    <p class="kicker"><span class="mono">404</span> ERR</p>
    <h1 class="wordmark shrink">{{ ui.not_found_title }}</h1>
    <p class="lede">{{ ui.not_found_lede }}</p>
    <a class="action" href="{{ home_href }}"><span>{{ ui.not_found_cta }}</span><span class="action-glyph" aria-hidden="true">→</span></a>
  </div>
</section>
{% endblock %}
