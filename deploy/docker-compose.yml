services:
  sdkpods:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sdkpods:local
    container_name: sdkpods
    restart: unless-stopped
    environment:
      SDKPODS_DOMAIN: sdkpods.com
      SDKPODS_HTTP_PORT: "80"
      SDKPODS_HTTPS_PORT: "443"
      SDKPODS_AUTO_TLS: "1"
      SDKPODS_REDIRECT_HTTP: "1"
      SDKPODS_LOG_JSON: "1"
      RUST_LOG: info,sdkpods=info,tower_http=info
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../content:/app/content:ro
      - ../downloads:/app/downloads:ro
      - sdkpods-certs:/app/certs
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # binding 80/443 inside container as non-root needs NET_BIND_SERVICE
    cap_add:
      - NET_BIND_SERVICE

volumes:
  sdkpods-certs:
