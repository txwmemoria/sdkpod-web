<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="摸鱼司 · SDK Pods 的护眼小游戏合集：慢节奏、不晃眼，纯浏览器运行。">
<meta name="theme-color" content="#e9efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161d1a" media="(prefers-color-scheme: dark)">
<link rel="icon" id="favicon" href="../assets/img/mark.svg" type="image/svg+xml">
<title>摸鱼司 · 内部效率平台</title>
<script>try{var d=JSON.parse(localStorage.getItem("mg.v1")||"{}"),t=d.theme||localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="摸鱼司" data-i18n-aria="app.brand">
      <span class="brand-mark" aria-hidden="true" data-i18n="app.mark">摸</span>
      <span data-i18n="app.brand">摸鱼司</span>
    </a>

    <span class="spacer"></span>

    <div class="top-actions">
      <div class="music" id="music">
        <button class="music-btn" id="btnMusic" type="button" data-i18n-title="music.title">
          <span class="music-ico" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="music-label" data-i18n="music.play">音乐</span>
        </button>
        <button class="icon-btn music-next" id="btnMusicNext" type="button" data-i18n-title="music.next" data-i18n-aria="music.next" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8 6-8 6zM17 6v12"/></svg>
        </button>
      </div>
      <button class="btn btn-quiet" id="btnFake" type="button" data-i18n-title="app.bossKey">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10"/></svg></span>
        <span class="btn-label" data-i18n="app.bossKey">假装工作</span>
        <kbd>Esc</kbd>
      </button>
      <button class="icon-btn" id="btnLang" type="button" data-i18n-title="app.langTitle" data-i18n-aria="app.langTitle">EN</button>
      <button class="icon-btn" id="btnSound" type="button" data-i18n-title="app.soundOff" aria-label="Sound"></button>
      <button class="icon-btn" id="btnTheme" type="button" data-i18n-title="app.themeDark" aria-label="Theme"></button>
      <a class="home-link" id="homeLink" href="../" data-i18n-title="app.home">
        <img src="../assets/img/mark.svg" width="18" height="18" alt="">
        <span>SDK Pods</span>
      </a>
    </div>
  </header>

  <main class="view" id="view"></main>

  <footer class="foot">
    <a href="../" data-i18n="app.footer">SDK Pods · 歇一会儿</a>
    <span class="foot-wx" id="footMusic" hidden>· <a href="https://archive.org/details/musopen-chopin" target="_blank" rel="noopener noreferrer" data-i18n="music.credit">音乐 Musopen · 公共领域</a></span>
    <span class="foot-wx" id="footWx" hidden>· <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" data-i18n="app.wxCredit">天气 Open-Meteo</a></span>
  </footer>
</div>

<!-- 假装工作：内容由 js/fake.js 生成（表格 / 代码 / 会议纪要，Tab 轮换） -->
<div class="fakescreen" id="fakescreen" hidden aria-hidden="true"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Google AdSense：填好 client（ca-pub-…）和两个广告单元 id 就会出现；留空则不加载任何广告代码 -->
<script>window.MG_ADS = { client: '', hub: '', play: '' };</script>
<script src="js/core.js?v=20"></script>
<script src="js/i18n.js?v=20"></script>
<script src="js/art.js?v=20"></script>
<script src="js/weather.js?v=20"></script>
<script src="js/music.js?v=20"></script>
<script src="js/ads.js?v=20"></script>
<script src="js/fake.js?v=20"></script>
<script src="js/games/memory.js?v=20"></script>
<script src="js/games/lights.js?v=20"></script>
<script src="js/games/cups.js?v=20"></script>
<script src="js/games/slide.js?v=20"></script>
<script src="js/games/sudoku.js?v=20"></script>
<script src="js/games/sweep.js?v=20"></script>
<script src="js/games/garden.js?v=20"></script>
<script src="js/games/receipt.js?v=20"></script>
<script src="js/games/golf.js?v=20"></script>
<script src="js/games/tetris.js?v=20"></script>
<script src="js/games/snake.js?v=20"></script>
<script src="js/app.js?v=20"></script>
</body>
</html>
