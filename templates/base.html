<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e8ecf0" />
  <meta name="description" content="{{ studio_name }}" />
  <title>{% block title %}{{ studio_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <link rel="icon" href="/assets/img/mark.svg" type="image/svg+xml" />
  <link rel="alternate" hreflang="zh-CN" href="/zh" />
  <link rel="alternate" hreflang="en" href="/en" />
</head>
<body data-lang="{{ lang }}">
  <div class="sysbar">
    <span>{{ domain }}</span>
    <span class="sysbar-sep">/</span>
    <span>build {{ year }}</span>
    <span class="sysbar-sep">/</span>
    <span>{{ lang|upper }}</span>
  </div>

  <header class="top">
    <a class="brand" href="{{ home_href }}" aria-label="{{ studio_name }}">
      <img class="brand-mark" src="/assets/img/mark.svg" width="28" height="28" alt="" />
      <span class="brand-name">{{ studio_name }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ home_href }}#works">{{ ui.nav_works }}</a>
      <a href="{{ home_href }}#about">{{ ui.nav_about }}</a>
      <a href="mailto:{{ contact_email }}">{{ ui.nav_contact }}</a>
      <a class="lang" href="{{ switch_href }}" hreflang="{% if lang == "zh" %}en{% else %}zh-CN{% endif %}">{{ switch_label }}</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <div class="foot-brand">
      <img src="/assets/img/mark.svg" width="20" height="20" alt="" />
      <div>
        <strong>{{ studio_name }}</strong>
        <span>{{ domain }}</span>
      </div>
    </div>
    <p>© {{ year }} {{ studio_name }}. {{ ui.footer_note }}</p>
  </footer>

  <script src="/assets/js/site.js" defer></script>
</body>
</html>
