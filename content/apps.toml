id = "sync-work"
name = "sw"
tagline_zh = "跨机器验证与 AI 上下文同步"
tagline_en = "Cross-machine verify and AI context sync"
description_zh = "在 Windows / macOS / Linux 两台对等机器上开发同一项目时，用一条命令把未提交改动送到对端编译测试，并把 Claude 等本地 AI 会话一并带走。无需先 push，也不碰对端工作区。基于 iroh：局域网直连，跨网走加密中继。"
description_en = "On two peer machines (Windows, macOS, or Linux), verify your current working tree—including uncommitted files—on the other side, and carry local AI session context with you. No push required; the peer checkout stays untouched. Built on iroh: LAN direct when possible, encrypted relay across networks."
platforms = ["macOS", "Windows", "Linux"]
