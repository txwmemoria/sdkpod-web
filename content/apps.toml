release_date = "2026-11-10"
repo_url = "https://github.com/txwmemoria/sync-work"
size_label = "MIT"
featured = true
accent = "#2a6b75"
status = "stable"
install_zh = "cargo install --git https://github.com/txwmemoria/sync-work --locked"
install_en = "cargo install --git https://github.com/txwmemoria/sync-work --locked"
