<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — SDK Pods</title>
  <meta name="robots" content="noindex" />
  <!-- Self-contained on purpose: a 404 can be served from any path depth. -->
  <style>
    :root { --paper: #ffffff; --ink: #0b0d12; --ink-2: #566070; --rule: #dfe3e8; --accent: #007a52; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0a0c0f; --ink: #e8ecf1; --ink-2: #8b94a3; --rule: #232831; --accent: #2fe6a0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 30rem; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.8rem; letter-spacing: 0.08em; color: var(--accent); }
    h1 { margin: 0.5rem 0 0.75rem; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; letter-spacing: -0.02em; }
    p { margin: 0 0 0.4rem; color: var(--ink-2); }
    nav { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.6rem; }
    a {
      display: inline-flex; align-items: center; min-height: 2.6rem; padding: 0 1.05rem;
      border: 1px solid var(--rule); border-radius: 8px; color: inherit; font-weight: 600; font-size: 0.92rem; text-decoration: none;
    }
    a:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · SDK PODS</p>
    <h1>Page not found</h1>
    <p>Nothing lives at this address. Head home to keep browsing.</p>
    <p lang="zh-CN">这个地址没有对应内容。回到首页继续浏览。</p>
    <nav>
      <a href="/en/">Back home →</a>
      <a href="/zh/" lang="zh-CN">返回首页 →</a>
    </nav>
  </main>
</body>
</html>
